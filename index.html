<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Haven | Global Relief Coordination</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
  <body class="dark bg-slate-950 text-slate-100 antialiased overflow-x-hidden min-h-screen relative font-sans transition-colors duration-300">
    <!-- Prevent FOUC: apply saved theme class before React loads -->
    <script>
      (function() {
        var stored = localStorage.getItem('crisiskit_theme');
        // Default to dark if no preference saved
        if (stored === 'light') {
          document.documentElement.classList.remove('dark');
          document.body.classList.remove('dark');
          document.body.style.backgroundColor = '#f8fafc';
          document.body.style.color = '#0f172a';
        } else {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
